<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2e7d32" />
    <meta
      name="description"
      content="A simple mobile-first grocery list that stores items locally in the browser."
    />
    <title>Grocery List</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Shopping</p>
          <h1>🛒 Grocery List</h1>
        </div>
        <div class="topbar-actions">
          <button id="shoppingModeButton" class="secondary-button shopping-mode-button" type="button">Shopping Mode</button>
          <button id="addButton" class="primary-button" type="button">+ Add Grocery</button>
        </div>
      </header>

      <section class="quick-add" aria-label="Quick add grocery item">
        <div class="quick-add-field">
          <input
            id="quickAddInput"
            type="text"
            placeholder="🔍 What do you need?"
            aria-label="Add grocery item"
            autocomplete="off"
          />
          <div id="quickAddSuggestions" class="quick-add-suggestions hidden" role="listbox" aria-label="Matching grocery items"></div>
        </div>
        <button id="quickAddButton" class="primary-button" type="button">Add</button>
      </section>

      <div class="quick-entry-row">
        <label class="mini-field">
          <span>Qty</span>
          <input id="quickAddQuantity" type="number" min="0.1" step="0.1" value="1" aria-label="Quantity" />
        </label>
        <label class="mini-field">
          <span>Unit</span>
          <select id="quickAddUnit" aria-label="Unit">
            <option value="ml">ml</option>
            <option value="L">L</option>
            <option value="g">g</option>
            <option value="kg">kg</option>
            <option value="pcs">pcs</option>
            <option value="dozen">dozen</option>
            <option value="packet">packet</option>
            <option value="pack">pack</option>
            <option value="bottle">bottle</option>
            <option value="box">box</option>
            <option value="can">can</option>
            <option value="jar">jar</option>
          </select>
        </label>
      </div>

      <div id="recentSuggestions" class="recent-suggestions" aria-live="polite"></div>

      <section class="toolbar" aria-label="Search and filter groceries">
        <label class="search-box" for="searchInput">
          <span class="sr-only">Search groceries</span>
          <input
            id="searchInput"
            type="search"
            placeholder="🔍 Search groceries..."
            aria-label="Search groceries"
          />
        </label>

        <div class="filters">
          <label class="field">
            <span>Category</span>
            <select id="categoryFilter" aria-label="Filter by category">
              <option value="All Categories">All Categories</option>
              <option value="Pulses & Grains">Pulses & Grains</option>
              <option value="Flours & Starches">Flours & Starches</option>
              <option value="Spices & Condiments">Spices & Condiments</option>
              <option value="Oils & Cooking Liquids">Oils & Cooking Liquids</option>
              <option value="Dairy & Fresh Produce">Dairy & Fresh Produce</option>
              <option value="Beverages & Sweeteners">Beverages & Sweeteners</option>
              <option value="Dishwashing">Dishwashing</option>
              <option value="Laundry & Floor Cleaning">Laundry & Floor Cleaning</option>
              <option value="Personal Care & Hygiene">Personal Care & Hygiene</option>
              <option value="Paper & Disposable Goods">Paper & Disposable Goods</option>
              <option value="Others">Others</option>
            </select>
          </label>

          <label class="field">
            <span>Sort by</span>
            <select id="sortSelect" aria-label="Sort groceries">
              <option value="recent">Recently Added</option>
              <option value="name">Name</option>
              <option value="category">Category</option>
              <option value="purchased">Purchased</option>
            </select>
          </label>
        </div>
      </section>

      <section class="summary" aria-label="Grocery summary">
        <div class="summary-item">
          <strong id="itemsCount">0</strong>
          <span>Items</span>
        </div>
        <div class="summary-item">
          <strong id="purchasedCount">0</strong>
          <span>Purchased</span>
        </div>
      </section>

      <main>
        <div id="groceryList" class="grocery-list" aria-live="polite"></div>

        <div id="emptyState" class="empty-state hidden" aria-live="polite">
          <div class="empty-icon">🛒</div>
          <h2>Your grocery list is empty.</h2>
          <p>Add your first grocery item.</p>
          <div class="modal-actions empty-actions">
            <button id="emptyAddButton" class="primary-button" type="button">+ Add Grocery</button>
            <button id="emptyAddDefaultButton" class="secondary-button" type="button">Add Default Categories</button>
          </div>
        </div>
      </main>

      <section id="printArea" class="print-area" aria-live="polite"></section>

      <div class="sticky-actions">
        <button id="pdfButton" class="accent-button" type="button">📄 Generate PDF</button>
        <button id="clearPurchasedButton" class="ghost-button" type="button">Clear Purchased</button>
        <button id="clearAllButton" class="danger-button" type="button">Clear All</button>
      </div>
    </div>

    <div id="pdfCategoryDialog" class="modal hidden" aria-hidden="true">
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="pdfCategoryTitle">
        <div class="modal-header">
          <h2 id="pdfCategoryTitle">Select categories for PDF</h2>
          <button id="pdfCloseButton" type="button" class="icon-button" aria-label="Close category selector">×</button>
        </div>

        <div id="pdfCategoryList" class="pdf-category-list"></div>

        <div class="modal-actions">
          <button id="pdfSelectAllButton" type="button" class="secondary-button">Select All</button>
          <button id="pdfCancelButton" type="button" class="secondary-button">Cancel</button>
          <button id="pdfGenerateButton" type="button" class="primary-button">Generate PDF</button>
        </div>
      </div>
    </div>

    <div id="defaultCategoryDialog" class="modal hidden" aria-hidden="true">
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="defaultCategoryTitle">
        <div class="modal-header">
          <h2 id="defaultCategoryTitle">Add default categories</h2>
          <button id="defaultCategoryCloseButton" type="button" class="icon-button" aria-label="Close default category selector">×</button>
        </div>

        <div id="defaultCategoryList" class="pdf-category-list"></div>

        <div class="modal-actions">
          <button id="defaultCategorySelectAllButton" type="button" class="secondary-button">Select All</button>
          <button id="defaultCategoryCancelButton" type="button" class="secondary-button">Cancel</button>
          <button id="defaultCategoryAddButton" type="button" class="primary-button">Add Selected</button>
        </div>
      </div>
    </div>

    <div id="itemDialog" class="modal hidden" aria-hidden="true">
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
        <div class="modal-header">
          <h2 id="dialogTitle">Add Grocery</h2>
          <button id="closeDialogButton" type="button" class="icon-button" aria-label="Close dialog">×</button>
        </div>

        <form id="groceryForm">
          <label class="field">
            <span>Item name</span>
            <input id="itemName" name="itemName" type="text" maxlength="80" required />
          </label>

          <div class="two-columns">
            <label class="field">
              <span>Quantity</span>
              <input id="itemQuantity" name="itemQuantity" type="number" min="0.1" step="0.1" required />
            </label>

            <label class="field">
              <span>Unit</span>
              <select id="itemUnit" name="itemUnit">
                <option value="kg">kg</option>
                <option value="g">g</option>
                <option value="L">L</option>
                <option value="ml">ml</option>
                <option value="packet">packet</option>
                <option value="box">box</option>
                <option value="piece">piece</option>
                <option value="dozen">dozen</option>
                <option value="bottle">bottle</option>
                <option value="bundle">bundle</option>
                <option value="custom">Custom</option>
              </select>
            </label>
          </div>

          <label id="customUnitWrap" class="field hidden">
            <span>Custom unit</span>
            <input id="customUnit" name="customUnit" type="text" maxlength="20" placeholder="e.g. pack" />
          </label>

          <label class="field">
            <span>Category</span>
            <select id="itemCategory" name="itemCategory">
              <option value="">Select category (optional)</option>
              <option value="Pulses & Grains">Pulses & Grains</option>
              <option value="Flours & Starches">Flours & Starches</option>
              <option value="Spices & Condiments">Spices & Condiments</option>
              <option value="Oils & Cooking Liquids">Oils & Cooking Liquids</option>
              <option value="Dairy & Fresh Produce">Dairy & Fresh Produce</option>
              <option value="Beverages & Sweeteners">Beverages & Sweeteners</option>
              <option value="Dishwashing">Dishwashing</option>
              <option value="Laundry & Floor Cleaning">Laundry & Floor Cleaning</option>
              <option value="Personal Care & Hygiene">Personal Care & Hygiene</option>
              <option value="Paper & Disposable Goods">Paper & Disposable Goods</option>
              <option value="Others">Others</option>
            </select>
          </label>

          <div class="modal-actions">
            <button type="button" id="cancelItemButton" class="secondary-button">Cancel</button>
            <button type="submit" class="primary-button">Save</button>
          </div>
        </form>
      </div>
    </div>

    <div id="confirmDialog" class="modal hidden" aria-hidden="true">
      <div class="modal-card confirm-card" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
        <h2 id="confirmTitle">Delete item?</h2>
        <p id="confirmMessage">Are you sure?</p>
        <div class="modal-actions">
          <button type="button" id="cancelConfirmButton" class="secondary-button">Cancel</button>
          <button type="button" id="confirmActionButton" class="danger-button">Delete</button>
        </div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
